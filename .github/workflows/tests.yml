name: tests

on:
  push:
    branches: [main]
  pull_request:

# A aplicação vive em gestao-app/; a raiz do repositório guarda a
# documentação e o sistema desktop legado (somente leitura).
defaults:
  run:
    working-directory: gestao-app

jobs:
  ci:
    runs-on: ubuntu-latest

    # Os testes rodam em MariaDB, não em SQLite (ADR-0002).
    # O ERP depende de comportamento que o SQLite não reproduz:
    # SELECT ... FOR UPDATE na numeração fiscal (BR-602), DECIMAL(15,2)
    # e (15,3) sem conversão para float (ADR-0013) e transações do ledger
    # de estoque (ADR-0008). Testar em SQLite daria confiança falsa.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: erp_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mesma versão e mesmas extensões da produção (ver
      # docs/23-Deploy/01-validacao-ambiente-business.md). Divergência
      # entre CI e produção é fonte de bug que só aparece no deploy.
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_mysql, soap, zip, gd, dom, xml, simplexml, curl, openssl, fileinfo, tokenizer
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gestao-app/package-lock.json

      - name: Dependências PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Dependências JS
        run: npm ci

      - name: Build dos assets
        run: npm run build

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      # Convenção da pasta 04, regra 2: `down()` funcional e testado.
      # Sem isto, um rollback só é descoberto quebrado no dia em que
      # precisa funcionar — durante um incidente em produção.
      - name: Migrar (ida, volta e ida)
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      # Cobre unit, feature (incluindo assertInertia) e os testes de
      # arquitetura que verificam as fronteiras entre módulos (ADR-0020).
      - name: Testes de backend
        run: php artisan test

      - name: Testes de frontend
        run: npm run test:ci
