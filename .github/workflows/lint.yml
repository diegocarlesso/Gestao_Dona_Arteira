name: qualidade

on:
  push:
    branches: [main]
  pull_request:

# O CI é BLOQUEANTE: aqui nada é corrigido automaticamente, tudo é
# verificado. Um passo que conserta o código em vez de reprovar dá a
# impressão de qualidade sem entregá-la.

# A aplicação vive em gestao-app/; a raiz do repositório guarda a
# documentação e o sistema desktop legado (somente leitura).
defaults:
  run:
    working-directory: gestao-app

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `soap`, `zip`, `simplexml` e `openssl` entram por causa do
      # `nfephp-org/sped-nfe`: ele os declara como `ext-*` no composer.json,
      # e sem eles o `composer install` deste job reprova antes de instalar
      # qualquer coisa. Mesma lista do job de testes e da produção
      # (docs/23-Deploy/01, verificada nos dois SAPIs em 2026-08-10).
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_mysql, dom, xml, simplexml, curl, soap, zip, openssl, tokenizer
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gestao-app/package-lock.json

      - name: Dependências
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      # --test reprova em vez de reescrever os arquivos.
      - name: Estilo do PHP (Pint)
        run: vendor/bin/pint --test

      # Via composer: o script fixa --memory-limit=1G. O padrão de 128M
      # do PHP CLI derruba o worker paralelo do PHPStan.
      - name: Análise estática (Larastan)
        run: composer analyse

      - name: Formatação do frontend (Prettier)
        run: npm run format:check

      - name: Lint do frontend (ESLint)
        run: npm run lint:check

      - name: Tipos do frontend (TypeScript)
        run: npm run types
